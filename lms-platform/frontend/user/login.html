<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - LMS 플랫폼</title>
    <link rel="stylesheet" href="/common/css/style.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .login-header p {
            color: var(--text-light);
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .demo-accounts {
            margin-top: 30px;
            padding: 20px;
            background-color: var(--light-color);
            border-radius: 8px;
        }

        .demo-accounts h3 {
            margin-bottom: 10px;
            font-size: 1rem;
        }

        .demo-accounts ul {
            list-style: none;
            font-size: 0.875rem;
            color: var(--text-light);
        }

        .demo-accounts ul li {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>LMS 플랫폼</h1>
            <p>학습 관리 시스템</p>
        </div>

        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label class="form-label">아이디</label>
                <input type="text" id="username" class="form-control" required>
            </div>

            <div class="form-group">
                <label class="form-label">비밀번호</label>
                <input type="password" id="password" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary">로그인</button>
        </form>

        <div class="demo-accounts">
            <h3>테스트 계정</h3>
            <ul>
                <li><strong>학생:</strong> student1 / student123</li>
                <li><strong>강사:</strong> instructor1 / instructor123</li>
                <li><strong>관리자:</strong> admin / admin123</li>
            </ul>
        </div>
    </div>

    <script src="/common/js/api.js"></script>
    <script src="/common/js/utils.js"></script>
    <script>
        // 이미 로그인된 경우 대시보드로 리다이렉트
        checkAuth(false).then(user => {
            if (user) {
                if (user.role === 'admin' || user.role === 'system_admin') {
                    window.location.href = '../admin/index.html';
                } else {
                    window.location.href = 'index.html';
                }
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                showLoading();
                const response = await AuthAPI.login(username, password);

                if (response.success) {
                    setCurrentUser(response.user);
                    showSuccess('로그인 성공!');

                    setTimeout(() => {
                        // 관리자는 관리자 페이지로, 일반 사용자는 사용자 페이지로
                        if (response.user.role === 'admin' || response.user.role === 'system_admin') {
                            window.location.href = '../admin/index.html';
                        } else {
                            window.location.href = 'index.html';
                        }
                    }, 1000);
                } else {
                    showError(response.message || '로그인에 실패했습니다.');
                }
            } catch (error) {
                showError(error.message || '로그인 중 오류가 발생했습니다.');
            } finally {
                hideLoading();
            }
        });
    </script>
</body>
</html>
