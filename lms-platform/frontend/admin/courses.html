<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>과정 관리 - LMS 관리자</title>
    <link rel="stylesheet" href="/common/css/style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <a href="index.html" class="logo">LMS 관리자</a>
            <div class="user-info">
                <span class="user-name" id="userName"></span>
                <button class="btn btn-sm btn-secondary" onclick="logout()">로그아웃</button>
            </div>
        </div>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">대시보드</a></li>
            <li><a href="courses.html" class="active">과정 관리</a></li>
            <li><a href="students.html">학생 관리</a></li>
            <li><a href="exams.html">시험 관리</a></li>
            <li><a href="materials.html">교재 관리</a></li>
            <li><a href="users.html">사용자 관리</a></li>
        </ul>
    </nav>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin: 20px 0;">
            <h1>과정 관리</h1>
            <button class="btn btn-primary" onclick="openCourseModal()">새 과정 등록</button>
        </div>

        <div id="coursesList">
            <div class="spinner"></div>
        </div>
    </div>

    <!-- 과정 등록/수정 모달 -->
    <div id="courseModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">새 과정 등록</h2>
                <button class="close" onclick="closeModal('courseModal')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="courseForm">
                    <div class="form-group">
                        <label class="form-label">과정명</label>
                        <input type="text" id="courseName" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">과정 코드</label>
                        <input type="text" id="courseCode" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">설명</label>
                        <textarea id="courseDesc" class="form-control"></textarea>
                    </div>
                    <div class="row">
                        <div class="col-6">
                            <div class="form-group">
                                <label class="form-label">시작일</label>
                                <input type="date" id="startDate" class="form-control">
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="form-group">
                                <label class="form-label">종료일</label>
                                <input type="date" id="endDate" class="form-control">
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">최대 인원</label>
                        <input type="number" id="maxStudents" class="form-control" value="30">
                    </div>
                    <button type="submit" class="btn btn-primary">저장</button>
                </form>
            </div>
        </div>
    </div>

    <script src="/common/js/api.js"></script>
    <script src="/common/js/utils.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        let currentUser = null;
        let editingCourseId = null;

        document.addEventListener('DOMContentLoaded', async () => {
            currentUser = await checkAuth();
            if (currentUser) {
                if (!['admin', 'system_admin'].includes(currentUser.role)) {
                    showError('관리자 권한이 필요합니다.');
                    setTimeout(() => window.location.href = '../user/index.html', 2000);
                    return;
                }
                document.getElementById('userName').textContent = currentUser.full_name;
                loadCourses();
            }
        });

        document.getElementById('courseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await saveCourse();
        });

        async function loadCourses() {
            try {
                const response = await CourseAPI.getAll();
                if (response.success) {
                    renderCourses(response.courses);
                }
            } catch (error) {
                showError('과정 목록을 불러오는데 실패했습니다.');
            }
        }

        function renderCourses(courses) {
            const container = document.getElementById('coursesList');

            if (courses.length === 0) {
                container.innerHTML = '<p class="text-muted">등록된 과정이 없습니다.</p>';
                return;
            }

            const html = `
                <table class="table">
                    <thead>
                        <tr>
                            <th>과정명</th>
                            <th>과정 코드</th>
                            <th>기간</th>
                            <th>정원</th>
                            <th>상태</th>
                            <th>작업</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${courses.map(course => `
                            <tr>
                                <td><strong>${course.course_name}</strong></td>
                                <td>${course.course_code}</td>
                                <td>${formatDate(course.start_date)} ~ ${formatDate(course.end_date)}</td>
                                <td>${course.max_students}명</td>
                                <td>
                                    <span class="badge ${course.is_active ? 'badge-success' : 'badge-secondary'}">
                                        ${course.is_active ? '활성' : '비활성'}
                                    </span>
                                </td>
                                <td>
                                    <button class="btn btn-sm btn-primary" onclick="editCourse(${course.id})">수정</button>
                                    <button class="btn btn-sm btn-danger" onclick="deleteCourse(${course.id})">삭제</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;

            container.innerHTML = html;
        }

        function openCourseModal() {
            editingCourseId = null;
            document.getElementById('modalTitle').textContent = '새 과정 등록';
            document.getElementById('courseForm').reset();
            openModal('courseModal');
        }

        async function editCourse(courseId) {
            try {
                const response = await CourseAPI.getById(courseId);
                if (response.success) {
                    const course = response.course;
                    editingCourseId = courseId;

                    document.getElementById('modalTitle').textContent = '과정 수정';
                    document.getElementById('courseName').value = course.course_name;
                    document.getElementById('courseCode').value = course.course_code;
                    document.getElementById('courseDesc').value = course.description || '';
                    document.getElementById('startDate').value = course.start_date || '';
                    document.getElementById('endDate').value = course.end_date || '';
                    document.getElementById('maxStudents').value = course.max_students;

                    openModal('courseModal');
                }
            } catch (error) {
                showError('과정 정보를 불러오는데 실패했습니다.');
            }
        }

        async function saveCourse() {
            const courseData = {
                course_name: document.getElementById('courseName').value,
                course_code: document.getElementById('courseCode').value,
                description: document.getElementById('courseDesc').value,
                start_date: document.getElementById('startDate').value,
                end_date: document.getElementById('endDate').value,
                max_students: parseInt(document.getElementById('maxStudents').value)
            };

            try {
                showLoading();
                let response;

                if (editingCourseId) {
                    response = await CourseAPI.update(editingCourseId, courseData);
                } else {
                    response = await CourseAPI.create(courseData);
                }

                if (response.success) {
                    showSuccess(editingCourseId ? '과정이 수정되었습니다.' : '과정이 등록되었습니다.');
                    closeModal('courseModal');
                    loadCourses();
                }
            } catch (error) {
                showError(error.message || '과정 저장 중 오류가 발생했습니다.');
            } finally {
                hideLoading();
            }
        }

        async function deleteCourse(courseId) {
            if (!confirm('정말 이 과정을 삭제하시겠습니까?')) {
                return;
            }

            try {
                showLoading();
                const response = await CourseAPI.delete(courseId);

                if (response.success) {
                    showSuccess('과정이 삭제되었습니다.');
                    loadCourses();
                }
            } catch (error) {
                showError('과정 삭제 중 오류가 발생했습니다.');
            } finally {
                hideLoading();
            }
        }
    </script>
</body>
</html>
