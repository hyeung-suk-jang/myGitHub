<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교재 관리 - LMS 관리자</title>
    <link rel="stylesheet" href="../common/css/style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <a href="index.html" class="logo">LMS 관리자</a>
            <div class="user-info">
                <span class="user-name" id="userName"></span>
                <button class="btn btn-sm btn-secondary" onclick="logout()">로그아웃</button>
            </div>
        </div>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">대시보드</a></li>
            <li><a href="courses.html">과정 관리</a></li>
            <li><a href="students.html">학생 관리</a></li>
            <li><a href="exams.html">시험 관리</a></li>
            <li><a href="materials.html" class="active">교재 관리</a></li>
            <li><a href="users.html">사용자 관리</a></li>
        </ul>
    </nav>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin: 20px 0;">
            <h1>교재 관리</h1>
            <button class="btn btn-primary" onclick="openMaterialModal()">새 교재 등록</button>
        </div>

        <div id="materialsList">
            <div class="spinner"></div>
        </div>
    </div>

    <!-- 교재 등록 모달 -->
    <div id="materialModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">새 교재 등록</h2>
                <button class="close" onclick="closeModal('materialModal')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="materialForm">
                    <div class="form-group">
                        <label class="form-label">제목</label>
                        <input type="text" id="materialTitle" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">설명</label>
                        <textarea id="materialDesc" class="form-control"></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">파일 유형</label>
                        <select id="fileType" class="form-control">
                            <option value="pdf">PDF</option>
                            <option value="video">동영상</option>
                            <option value="document">문서</option>
                            <option value="link">링크</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">동영상 URL (동영상인 경우)</label>
                        <input type="url" id="videoUrl" class="form-control">
                    </div>
                    <div class="form-group">
                        <label class="form-label">난이도</label>
                        <select id="difficulty" class="form-control">
                            <option value="beginner">초급</option>
                            <option value="intermediate" selected>중급</option>
                            <option value="advanced">고급</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">태그 (쉼표로 구분)</label>
                        <input type="text" id="tags" class="form-control" placeholder="예: HTML, CSS, JavaScript">
                    </div>
                    <button type="submit" class="btn btn-primary">등록</button>
                </form>
            </div>
        </div>
    </div>

    <script src="../common/js/api.js"></script>
    <script src="../common/js/utils.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', async () => {
            currentUser = await checkAuth();
            if (currentUser) {
                if (!['admin', 'system_admin', 'instructor'].includes(currentUser.role)) {
                    showError('권한이 없습니다.');
                    setTimeout(() => window.location.href = '../user/index.html', 2000);
                    return;
                }
                document.getElementById('userName').textContent = currentUser.full_name;
                loadMaterials();
            }
        });

        document.getElementById('materialForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await saveMaterial();
        });

        async function loadMaterials() {
            try {
                const response = await MaterialAPI.getAll();
                if (response.success) {
                    renderMaterials(response.materials);
                }
            } catch (error) {
                showError('교재 목록을 불러오는데 실패했습니다.');
            }
        }

        function renderMaterials(materials) {
            const container = document.getElementById('materialsList');

            if (materials.length === 0) {
                container.innerHTML = '<p class="text-muted">등록된 교재가 없습니다.</p>';
                return;
            }

            const html = `
                <table class="table">
                    <thead>
                        <tr>
                            <th>제목</th>
                            <th>유형</th>
                            <th>과정</th>
                            <th>난이도</th>
                            <th>버전</th>
                            <th>업로드일</th>
                            <th>작업</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${materials.map(material => `
                            <tr>
                                <td><strong>${material.title}</strong></td>
                                <td>${getFileIcon(material.file_type)} ${material.file_type}</td>
                                <td>${material.course_name || '-'}</td>
                                <td>${getDifficultyText(material.difficulty)}</td>
                                <td>v${material.version}</td>
                                <td>${formatDate(material.upload_date)}</td>
                                <td>
                                    <button class="btn btn-sm btn-danger" onclick="deleteMaterial(${material.id})">삭제</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;

            container.innerHTML = html;
        }

        function openMaterialModal() {
            document.getElementById('materialForm').reset();
            openModal('materialModal');
        }

        async function saveMaterial() {
            const tags = document.getElementById('tags').value
                .split(',')
                .map(tag => tag.trim())
                .filter(tag => tag);

            const materialData = {
                title: document.getElementById('materialTitle').value,
                description: document.getElementById('materialDesc').value,
                file_type: document.getElementById('fileType').value,
                video_url: document.getElementById('videoUrl').value,
                difficulty: document.getElementById('difficulty').value,
                tags: tags
            };

            try {
                showLoading();
                const response = await MaterialAPI.create(materialData);

                if (response.success) {
                    showSuccess('교재가 등록되었습니다.');
                    closeModal('materialModal');
                    loadMaterials();
                }
            } catch (error) {
                showError(error.message || '교재 등록 중 오류가 발생했습니다.');
            } finally {
                hideLoading();
            }
        }

        async function deleteMaterial(materialId) {
            if (!confirm('정말 이 교재를 삭제하시겠습니까?')) {
                return;
            }

            try {
                showLoading();
                const response = await MaterialAPI.delete(materialId);

                if (response.success) {
                    showSuccess('교재가 삭제되었습니다.');
                    loadMaterials();
                }
            } catch (error) {
                showError('교재 삭제 중 오류가 발생했습니다.');
            } finally {
                hideLoading();
            }
        }
    </script>
</body>
</html>
