<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>채팅 - EquipRent</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        .chat-container {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 0;
            height: calc(100vh - 100px);
            margin-top: 2rem;
        }

        .chat-rooms {
            border-right: 1px solid var(--border-color);
            background: white;
            overflow-y: auto;
        }

        .chat-room-item {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.3s;
        }

        .chat-room-item:hover {
            background: var(--light-color);
        }

        .chat-room-item.active {
            background: #e0f2fe;
        }

        .chat-room-name {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .chat-room-preview {
            font-size: 0.875rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-room-unread {
            background: var(--danger-color);
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            float: right;
        }

        .chat-main {
            display: flex;
            flex-direction: column;
            background: white;
        }

        .chat-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            background: var(--light-color);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            background: #f9fafb;
        }

        .chat-message {
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
        }

        .chat-message.sent {
            align-items: flex-end;
        }

        .chat-message.received {
            align-items: flex-start;
        }

        .message-bubble {
            max-width: 70%;
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            word-wrap: break-word;
        }

        .chat-message.sent .message-bubble {
            background: var(--primary-color);
            color: white;
            border-bottom-right-radius: 0.25rem;
        }

        .chat-message.received .message-bubble {
            background: white;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 0.25rem;
        }

        .message-sender {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 0.25rem;
            padding: 0 0.5rem;
        }

        .message-time {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
            padding: 0 0.5rem;
        }

        .chat-input-container {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border-color);
            background: white;
        }

        .chat-input-form {
            display: flex;
            gap: 0.5rem;
        }

        .chat-input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 2rem;
            resize: none;
            max-height: 100px;
        }

        .chat-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
        }

        @media (max-width: 768px) {
            .chat-container {
                grid-template-columns: 1fr;
            }

            .chat-rooms {
                display: none;
            }

            .chat-rooms.mobile-show {
                display: block;
            }

            .chat-main.mobile-hide {
                display: none;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo"><a href="../index.html">EquipRent</a></div>
                <nav>
                    <ul class="nav">
                        <li><a href="equipment-list.html">장비 검색</a></li>
                        <li><a href="chat.html">채팅</a></li>
                        <li><a href="renter-dashboard.html">대여 내역</a></li>
                    </ul>
                </nav>
                <div class="nav-actions">
                    <div id="user-menu"></div>
                </div>
            </div>
        </div>
    </header>

    <div class="container-fluid">
        <div class="chat-container">
            <!-- 채팅방 목록 -->
            <div class="chat-rooms" id="chatRooms">
                <div style="padding: 1rem; border-bottom: 1px solid var(--border-color);">
                    <h3>채팅</h3>
                </div>
                <div id="roomsList"></div>
            </div>

            <!-- 채팅 메인 -->
            <div class="chat-main" id="chatMain">
                <div class="chat-empty">
                    <div class="text-center">
                        <p>채팅방을 선택하거나 새로 시작하세요</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script>
        let currentRoomId = null;
        let currentRentalId = null;
        let lastMessageId = 0;
        let pollingTimer = null;
        let rooms = [];

        $(document).ready(async function() {
            if (!await requireAuth()) return;
            await updateUserMenu();
            await loadRooms();

            // 5초마다 채팅방 목록 갱신
            setInterval(loadRooms, 5000);
        });

        async function loadRooms() {
            try {
                const result = await api.get('chat.php?action=get-rooms');
                if (result.success) {
                    rooms = result.data.rooms;
                    displayRooms(rooms);
                }
            } catch (error) {
                console.error('Load rooms error:', error);
            }
        }

        function displayRooms(rooms) {
            const $list = $('#roomsList');

            if (rooms.length === 0) {
                $list.html(`
                    <div style="padding: 2rem; text-align: center; color: var(--text-secondary);">
                        <p>채팅방이 없습니다.</p>
                        <p style="font-size: 0.875rem; margin-top: 0.5rem;">
                            대여 신청 후 거래 상대방과 채팅할 수 있습니다.
                        </p>
                    </div>
                `);
                return;
            }

            const html = rooms.map(room => `
                <div class="chat-room-item ${room.room_id == currentRoomId ? 'active' : ''}"
                     onclick="openChatRoom(${room.room_id}, ${room.rental_id})">
                    <div class="chat-room-name">
                        ${room.counterpart_name}
                        ${room.unread_count > 0 ? `<span class="chat-room-unread">${room.unread_count}</span>` : ''}
                    </div>
                    <div class="chat-room-preview">
                        ${room.equipment_name || ''}
                    </div>
                    <div class="chat-room-preview">
                        ${room.last_message || '메시지를 시작하세요'}
                    </div>
                </div>
            `).join('');

            $list.html(html);
        }

        async function openChatRoom(roomId, rentalId) {
            currentRoomId = roomId;
            currentRentalId = rentalId;

            // 채팅방 목록 활성화 표시
            $('.chat-room-item').removeClass('active');
            $(event.target).closest('.chat-room-item').addClass('active');

            // 메시지 로드
            await loadMessages(roomId);

            // 읽음 처리
            await markAsRead(roomId);

            // 채팅 UI 표시
            displayChatUI(roomId);

            // Long polling 시작
            startPolling(roomId);
        }

        function displayChatUI(roomId) {
            const room = rooms.find(r => r.room_id == roomId);
            if (!room) return;

            const $chatMain = $('#chatMain');
            $chatMain.html(`
                <div class="chat-header">
                    <h3>${room.counterpart_name}</h3>
                    <div style="font-size: 0.875rem; color: var(--text-secondary);">
                        ${room.equipment_name}
                    </div>
                </div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-container">
                    <form class="chat-input-form" id="chatForm" onsubmit="sendMessage(event)">
                        <textarea class="chat-input" id="messageInput"
                                  placeholder="메시지를 입력하세요..."
                                  rows="1"
                                  onkeydown="handleEnter(event)"></textarea>
                        <button type="submit" class="btn btn-primary">전송</button>
                    </form>
                </div>
            `);
        }

        async function loadMessages(roomId) {
            try {
                const result = await api.get('chat.php?action=get-messages', { room_id: roomId });
                if (result.success) {
                    displayMessages(result.data.messages);
                    if (result.data.messages.length > 0) {
                        lastMessageId = result.data.messages[result.data.messages.length - 1].message_id;
                    }
                }
            } catch (error) {
                console.error('Load messages error:', error);
            }
        }

        function displayMessages(messages) {
            const $container = $('#chatMessages');
            $container.empty();

            messages.forEach(msg => {
                const isSent = msg.sender_id == currentUser.user_id;
                const messageHtml = `
                    <div class="chat-message ${isSent ? 'sent' : 'received'}">
                        ${!isSent ? `<div class="message-sender">${msg.sender_name}</div>` : ''}
                        <div class="message-bubble">${escapeHtml(msg.message)}</div>
                        <div class="message-time">${formatDateTime(msg.created_at)}</div>
                    </div>
                `;
                $container.append(messageHtml);
            });

            // 스크롤을 최하단으로
            $container.scrollTop($container[0].scrollHeight);
        }

        async function sendMessage(event) {
            event.preventDefault();

            const message = $('#messageInput').val().trim();
            if (!message || !currentRoomId) return;

            try {
                const result = await api.post('chat.php?action=send-message', {
                    room_id: currentRoomId,
                    message: message
                });

                if (result.success) {
                    $('#messageInput').val('');
                    appendMessage(result.data.message);
                    lastMessageId = result.data.message.message_id;
                }
            } catch (error) {
                console.error('Send message error:', error);
                showAlert('메시지 전송에 실패했습니다.', 'error');
            }
        }

        function appendMessage(msg) {
            const $container = $('#chatMessages');
            const isSent = msg.sender_id == currentUser.user_id;
            const messageHtml = `
                <div class="chat-message ${isSent ? 'sent' : 'received'}">
                    ${!isSent ? `<div class="message-sender">${msg.sender_name}</div>` : ''}
                    <div class="message-bubble">${escapeHtml(msg.message)}</div>
                    <div class="message-time">${formatDateTime(msg.created_at)}</div>
                </div>
            `;
            $container.append(messageHtml);
            $container.scrollTop($container[0].scrollHeight);
        }

        async function markAsRead(roomId) {
            try {
                await api.put('chat.php?action=mark-as-read', { room_id: roomId });
                await loadRooms(); // 채팅방 목록 갱신
            } catch (error) {
                console.error('Mark as read error:', error);
            }
        }

        function startPolling(roomId) {
            if (pollingTimer) {
                clearTimeout(pollingTimer);
            }

            pollForNewMessages(roomId);
        }

        async function pollForNewMessages(roomId) {
            if (currentRoomId != roomId) return;

            try {
                const result = await api.get('chat.php?action=poll-messages', {
                    room_id: roomId,
                    last_message_id: lastMessageId,
                    timeout: 20
                });

                if (result.success && result.data.has_new) {
                    result.data.messages.forEach(msg => {
                        appendMessage(msg);
                        lastMessageId = msg.message_id;
                    });
                    await markAsRead(roomId);
                }
            } catch (error) {
                console.error('Poll error:', error);
            }

            // 다시 polling
            pollingTimer = setTimeout(() => pollForNewMessages(roomId), 1000);
        }

        function handleEnter(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                $('#chatForm').submit();
            }
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
