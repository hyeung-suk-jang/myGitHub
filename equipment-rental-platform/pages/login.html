<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - EquipRent</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="container" style="max-width: 450px; margin-top: 5rem;">
        <div class="card">
            <div class="card-header text-center">
                <h2><a href="../index.html" class="logo">EquipRent</a></h2>
                <p style="color: var(--text-secondary); margin-top: 0.5rem;">로그인</p>
            </div>
            <div class="card-body">
                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label">이메일</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">비밀번호</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;" id="loginBtn">
                        로그인
                    </button>
                </form>

                <div style="text-align: center; margin-top: 1.5rem;">
                    <p class="text-secondary">
                        계정이 없으신가요?
                        <a href="register.html">회원가입</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script>
        $(document).ready(async function() {
            // 이미 로그인된 경우 리다이렉트
            const isAuth = await checkAuth();
            if (isAuth) {
                window.location.href = getDashboardUrl(currentUser.user_type);
                return;
            }

            $('#loginForm').on('submit', async function(e) {
                e.preventDefault();

                const email = $('#email').val().trim();
                const password = $('#password').val();

                if (!email || !password) {
                    showAlert('이메일과 비밀번호를 입력해주세요.', 'error');
                    return;
                }

                showLoading('loginBtn');

                try {
                    const result = await api.post('auth.php?action=login', {
                        email,
                        password
                    });

                    if (result.success) {
                        showAlert('로그인 성공!', 'success');
                        currentUser = result.data;

                        setTimeout(() => {
                            window.location.href = getDashboardUrl(result.data.user_type);
                        }, 1000);
                    } else {
                        showAlert(result.error || '로그인에 실패했습니다.', 'error');
                        hideLoading('loginBtn');
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    showAlert('로그인 중 오류가 발생했습니다.', 'error');
                    hideLoading('loginBtn');
                }
            });
        });
    </script>
</body>
</html>
