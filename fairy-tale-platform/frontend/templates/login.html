<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 동화책 열람 플랫폼</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="/">동화책 열람 플랫폼</a></h1>
        </div>
    </header>

    <main class="container">
        <div class="auth-form">
            <h2>로그인</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">이메일</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="error-message" id="error-message" style="display: none;"></div>
                <button type="submit" class="btn btn-primary">로그인</button>
            </form>
            <p class="auth-link">계정이 없으신가요? <a href="/register">회원가입</a></p>
        </div>
    </main>

    <script src="/static/js/app.js"></script>
    <script>
        $(document).ready(function() {
            $('#login-form').on('submit', function(e) {
                e.preventDefault();

                const email = $('#email').val();
                const password = $('#password').val();

                $.ajax({
                    url: '/api/users/login',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        email: email,
                        password: password
                    }),
                    success: function(response) {
                        localStorage.setItem('token', response.access_token);
                        localStorage.setItem('user', JSON.stringify(response.user));

                        if (response.user.user_type === 'author') {
                            window.location.href = '/author/dashboard';
                        } else {
                            window.location.href = '/reader/dashboard';
                        }
                    },
                    error: function(error) {
                        $('#error-message').text('로그인에 실패했습니다. 이메일과 비밀번호를 확인해주세요.').show();
                    }
                });
            });
        });
    </script>
</body>
</html>
