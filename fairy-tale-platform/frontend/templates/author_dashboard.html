<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>작가 대시보드 - 동화책 열람 플랫폼</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="/">동화책 열람 플랫폼</a></h1>
            <nav>
                <span id="username"></span>
                <a href="/book/upload" class="btn btn-primary">작품 등록</a>
                <a href="#" id="logout-btn" class="btn">로그아웃</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <h2>작가 대시보드</h2>

        <section class="earnings-section">
            <h3>수익 현황</h3>
            <div class="earnings-cards">
                <div class="card">
                    <h4>총 수익</h4>
                    <p class="amount" id="total-earnings">0원</p>
                </div>
                <div class="card">
                    <h4>현재 잔액</h4>
                    <p class="amount" id="current-balance">0원</p>
                </div>
                <div class="card">
                    <h4>총 판매 건수</h4>
                    <p class="amount" id="total-sales">0건</p>
                </div>
            </div>
            <button id="request-settlement-btn" class="btn btn-primary">정산 요청</button>
        </section>

        <section class="books-section">
            <h3>내 작품</h3>
            <div id="my-books" class="books-grid">
                <div class="loading">로딩 중...</div>
            </div>
        </section>

        <section class="settlements-section">
            <h3>정산 내역</h3>
            <div id="settlements-list">
                <div class="loading">로딩 중...</div>
            </div>
        </section>
    </main>

    <div id="settlement-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3>정산 요청</h3>
            <form id="settlement-form">
                <div class="form-group">
                    <label for="amount">정산 금액</label>
                    <input type="number" id="amount" name="amount" required>
                    <p class="help-text">최소 정산 금액: 10,000원</p>
                </div>
                <div class="form-group">
                    <label for="bank_account">계좌 정보</label>
                    <input type="text" id="bank_account" name="bank_account" placeholder="은행명 계좌번호" required>
                </div>
                <div class="form-group">
                    <label for="notes">메모 (선택)</label>
                    <textarea id="notes" name="notes" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">정산 요청</button>
            </form>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        $(document).ready(function() {
            requireAuth('author');
            loadEarnings();
            loadMyBooks();
            loadSettlements();

            $('#request-settlement-btn').on('click', function() {
                $('#settlement-modal').show();
            });

            $('.close').on('click', function() {
                $('#settlement-modal').hide();
            });

            $('#settlement-form').on('submit', function(e) {
                e.preventDefault();
                requestSettlement();
            });
        });

        function loadEarnings() {
            $.ajax({
                url: '/api/payments/my-earnings',
                method: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + localStorage.getItem('token')
                },
                success: function(data) {
                    $('#total-earnings').text(data.total_earnings.toLocaleString() + '원');
                    $('#current-balance').text(data.current_balance.toLocaleString() + '원');
                    $('#total-sales').text(data.total_sales + '건');
                }
            });
        }

        function loadMyBooks() {
            $.ajax({
                url: '/api/books/my-books',
                method: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + localStorage.getItem('token')
                },
                success: function(books) {
                    displayMyBooks(books);
                }
            });
        }

        function displayMyBooks(books) {
            if (books.length === 0) {
                $('#my-books').html('<p>아직 등록된 작품이 없습니다.</p>');
                return;
            }

            let html = '';
            books.forEach(function(book) {
                html += `
                    <div class="book-card">
                        <img src="${book.cover_image || '/static/images/default-book.png'}" alt="${book.title}">
                        <h4>${book.title}</h4>
                        <p class="price">${book.price.toLocaleString()}원</p>
                        <p class="views">조회수: ${book.views}</p>
                        <p class="status">${book.is_published ? '공개' : '비공개'}</p>
                        <a href="/book/${book.id}" class="btn">보기</a>
                    </div>
                `;
            });
            $('#my-books').html(html);
        }

        function loadSettlements() {
            $.ajax({
                url: '/api/settlements/my-settlements',
                method: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + localStorage.getItem('token')
                },
                success: function(settlements) {
                    displaySettlements(settlements);
                }
            });
        }

        function displaySettlements(settlements) {
            if (settlements.length === 0) {
                $('#settlements-list').html('<p>정산 내역이 없습니다.</p>');
                return;
            }

            let html = '<table><tr><th>날짜</th><th>금액</th><th>상태</th><th>계좌</th></tr>';
            settlements.forEach(function(settlement) {
                const date = new Date(settlement.settlement_date).toLocaleDateString('ko-KR');
                const statusText = {
                    'pending': '대기중',
                    'completed': '완료',
                    'failed': '실패'
                };
                html += `
                    <tr>
                        <td>${date}</td>
                        <td>${settlement.amount.toLocaleString()}원</td>
                        <td>${statusText[settlement.status] || settlement.status}</td>
                        <td>${settlement.bank_account || '-'}</td>
                    </tr>
                `;
            });
            html += '</table>';
            $('#settlements-list').html(html);
        }

        function requestSettlement() {
            const amount = parseFloat($('#amount').val());
            const bank_account = $('#bank_account').val();
            const notes = $('#notes').val();

            $.ajax({
                url: '/api/settlements/',
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + localStorage.getItem('token'),
                    'Content-Type': 'application/json'
                },
                data: JSON.stringify({
                    amount: amount,
                    bank_account: bank_account,
                    notes: notes
                }),
                success: function(response) {
                    alert('정산 요청이 완료되었습니다.');
                    $('#settlement-modal').hide();
                    $('#settlement-form')[0].reset();
                    loadEarnings();
                    loadSettlements();
                },
                error: function(error) {
                    let errorMsg = '정산 요청에 실패했습니다.';
                    if (error.responseJSON && error.responseJSON.detail) {
                        errorMsg = error.responseJSON.detail;
                    }
                    alert(errorMsg);
                }
            });
        }
    </script>
</body>
</html>
