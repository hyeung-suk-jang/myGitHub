# 서버 목록 설정 파일
# 형식: 서버IP|SSH포트|사용자명|설명
# 예시: 192.168.1.100|22|root|운영 웹서버 1

# 운영 서버
# 192.168.1.100|22|appuser|Web Server 1
# 192.168.1.101|22|appuser|WAS Server 1
# 192.168.1.102|22|appuser|WAS Server 2

# 개발 서버
# 192.168.2.100|22|devuser|Dev Web Server
# 192.168.2.101|22|devuser|Dev WAS Server

# 주의: 실제 서버 정보를 입력하세요
